<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Grail!</title>
</head>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        height: 100%;
    }

    html {
        overscroll-behavior: none;
        height: 100%;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        /*fr=fraction*/
        grid-template-row: repeat(5, 1fr);
        /*fr=fraction*/
        gap: 2px;
        width: 100%;
        height: 100%;
       
    }

    #cloud-one {
        display: grid;
        grid-column: 1 / 4;
        grid-row: 1 / 2;
        gap: 0px;
        padding: 0px;
        margin: 0px;
        position: center;
    }

    #cloud-two {
        display: grid;
        grid-column: 4 / 7;
        grid-row: 1 / 2;
        gap: 0px;
        padding: 0px;
        margin: 0px;
        position: center;
        transform: scaleX(-1);
    }

    #grass-one {
        display: grid;
        grid-column: 1 / 4;
        grid-row: 5 / 6;
        gap: 0px;
        padding: 0px;
        margin: 0px;
        position: center;
    }

    #grass-two {
        display: grid;
        grid-column: 4 / 7;
        grid-row: 5 / 6;
        gap: 0px;
        padding: 0px;
        margin: 0px;
        position: center;
    }

    #fish {
        display: grid;
        grid-column: 4 / 6;
        grid-row: 4/ 5;
        gap: 0px;
        padding: 0px;
        margin: 0px;
        position: center;
    }
</style>

<body>
    <div id="grid">
        <div id="cloud-one">
            <img width=720px src="images/clouds.PNG">
        </div>
        <div id="cloud-two">
            <img width=720px src="images/clouds.PNG">
        </div>

        <div id="fish">
            <img width=300px src="images/l-fish.PNG">
        </div>

        
        <div id="grass-one">
            <img width=720px src="images/grass.PNG">
        </div>
        <div id="grass-two">
            <img width=720px src="images/grass.PNG">
        </div>



    </div>
</body>

</html>
