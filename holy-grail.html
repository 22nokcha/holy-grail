<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Grail!</title>
</head>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        overflow-x: hidden;
        position: center;
        margin: 0px;
        height: 100%;
        /* Ensures html and body can grow */
        margin: 0;
        padding: 0;

    }

    html {
        overscroll-behavior: none;
        height: 100%;
        /* Ensures html and body can grow */
        margin: 0;
        padding: 0;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        /*fr=fraction*/
        grid-template-rows: repeat(5, 1fr);
        /*fr=fraction*/
        gap: 0px;
        margin: 0px;
        width: 100vh;
        height: 100vh;
        object-fit: cover;

    }

    #cloud-one {
        display: grid;
        padding: 1px;
        background-color: grey;
        stroke: black;
        grid-column: 1 / 3
    }

    #cloud-two {
        display: grid;
        padding: 1px;
        background-color: grey;
        grid-column: 4 / 6
    }

    #grass-one {
        display: grid;

    }

    #grass-two {
        display: grid;

    }

    #fish {}

    #dance-cat {
        display: grid;
        padding: 20px;
        stroke: red;
    }

    #crazy-cat {
        display: grid;
        padding: 20px;
        stroke: blue;
    }
</style>

<body>
    <div id="grid">
        <div id="cloud-one">

        </div>
        <div id="cloud-two">

        </div>

        <div id="fish">

        </div>

        <div id="dance-cat">

        </div>

        <div id="crazy-cat">

        </div>


        <div id="grass-one">

        </div>




    </div>
</body>

</html>
