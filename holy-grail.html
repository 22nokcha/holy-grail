<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>that fish can dance!</title>
</head>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        overflow-x: hidden;
        margin: 0%;
    }

    html {
        overscroll-behavior: none;

    }

    #grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        /*fr=fraction*/
        grid-template-rows: repeat(7, 1fr);
        gap: 1px;
        object-fit: cover;
        width: 100vw;
        height: 100vh;
    }

    #cloud-one {
        display: grid;
        padding: 1px;
       
        grid-column: 1 / 5;
        object-fit: cover;
    }

    #cloud-two {
        display: grid;
        padding: 1px;
      
        grid-column: 5 / 9;
        transform: scaleX(-1);
        object-fit: cover;
    }

    #grass-one {
        display: grid;
        padding: 1px;

        grid-column: 1 / 5;
        grid-row: 7 / 8;

        overflow: hidden;

    }

    #grass-two {
        display: grid;
        padding: 1px;

        grid-column: 5 / 9;
        grid-row: 7 / 8;
    }

    #fish {
        display: grid;
        padding: 1px;
        grid-column: 4 / 6;
        grid-row: 3 / 7;
    }

    #r-fish {
        display: grid;
        padding: 1px;
        grid-column: 4 / 6;
        grid-row: 3 / 7;
        opacity: 0%;
        transition: 0.01ms;
    }

    #r-fish:hover {
        opacity: 100%;
    }

    #quiet-cat {
        display: grid;
        padding: 1px;
        grid-column: 3 / 4;
        grid-row: 5 / 7;
    }

    #stare-quiet-cat {
        display: grid;
        padding: 1px;
        grid-column: 3 / 4;
        grid-row: 5 / 7;
        opacity: 0%;
        transition: 0.01ms;
        min-width: 0;
        min-height: 0;
    }

    #stare-quiet-cat:hover {
        opacity: 100%;
    }

    #dance-cat {
        display: grid;
        padding: 1px;
        grid-column: 6 / 8;
        grid-row: 5 / 7;
        opacity: 100%;
        transition: 0.01ms;
    }

    #r-dance-cat {
        display: grid;
        padding: 1px;
        grid-column: 6 / 8;
        grid-row: 5 / 7;
        opacity: 0%;
        transition: 0.01ms;
    }

    #r-dance-cat:hover {
        opacity: 100%;
    }
</style>

<body>
    <div id="grid">
        <div id="cloud-one">
            <img width="720px" src="images/clouds.PNG">
        </div>
        <div id="cloud-two">
            <img width="720px" src="images/clouds.PNG">
        </div>

        <div id="fish">
            <img width="300px" src="images/l-fish.PNG">
        </div>
        <div id="r-fish">
            <img width="300px" src="images/r-fish.PNG">
        </div>

        <div id="dance-cat">
            <img width="300px" src="images/l-cat.PNG">
        </div>
        <div id="r-dance-cat">
            <img width="300px" src="images/r-cat.PNG">
        </div>

        <div id="quiet-cat">
            <img width="210px" src="images/one-crazy.PNG">
        </div>
        <div id="stare-quiet-cat">
            <img width="230px" src="images/white-stare-quiet-cat.png">
        </div>

        <div id="grass-one">
            <img width="790px" src="images/grass.png">
        </div>
        <div id="grass-two">
            <img width="740px" src="images/grass.png">
        </div>

    </div>
</body>

</html>
